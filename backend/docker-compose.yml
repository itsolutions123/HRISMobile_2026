
services:
  hris-db:
    image: postgres:15-alpine
    container_name: hris-postgres-db
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - hris_pgdata:/var/lib/postgresql/data
    networks:
      - hris-network

  hris-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hris-fastapi-backend
    restart: unless-stopped
    ports:
      - "8089:8000"
    env_file:
      - .env
    depends_on:
      - hris-db
    networks:
      - hris-network

networks:
  hris-network:
    driver: bridge

volumes:
  hris_pgdata:
